services:
  study-partner:
    build: .
    ports:
      - "3000:3000"
    environment:
      # All optional. With none set, the app runs in demo mode with no keys.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-haiku-5-5}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - SARVAM_MODEL=${SARVAM_MODEL:-saaras:v4}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - DEMO_SIGNIN=${DEMO_SIGNIN:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - MAIL_FROM=${MAIL_FROM:-Study Partner <onboarding@resend.dev>}
    volumes:
      # Keeps student progress on the host between restarts.
      - ./data:/app/data
    restart: unless-stopped
