services:
  study-partner:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Optional. Leave empty and the app runs in demo mode with no key.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-haiku-5-5}
    volumes:
      # Keeps student progress on the host between restarts.
      - ./data:/app/data
    restart: unless-stopped
